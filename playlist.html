<script>

document.addEventListener('DOMContentLoaded', async () => {

  const loginButton =
    document.getElementById('spotify-login');

  const status =
    document.getElementById('spotify-status');

  const trackList =
    document.getElementById('spotify-track-list');

  const currentTitle =
    document.getElementById('current-track-title');

  const currentArtist =
    document.getElementById('current-track-artist');

  const playPauseButton =
    document.getElementById('play-pause-track');

  const previousButton =
    document.getElementById('previous-track');

  const nextButton =
    document.getElementById('next-track');


  // -------------------------------------------------------
  // LOGIN
  // -------------------------------------------------------

  loginButton.addEventListener('click', () => {

    window.MrYebraSpotify.login();

  });


  // -------------------------------------------------------
  // COMPROBAR AUTORIZACIÓN DE SPOTIFY
  // -------------------------------------------------------

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get('code');

  const state =
    params.get('state');

  const savedState =
    localStorage.getItem(
      'mr_yebra_spotify_state'
    );


  // -------------------------------------------------------
  // SI SPOTIFY DEVUELVE UN CÓDIGO
  // -------------------------------------------------------

  if (code) {

    if (
      !state ||
      !savedState ||
      state !== savedState
    ) {

      status.textContent =
        'Error de seguridad al conectar con Spotify.';

      return;

    }


    try {

      status.textContent =
        'Conectando con Spotify...';


      await exchangeSpotifyCode(code);


      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );


    } catch (error) {

      console.error(error);

      status.textContent =
        'No se ha podido conectar con Spotify.';

      return;

    }

  }


  // -------------------------------------------------------
  // COMPROBAR TOKEN
  // -------------------------------------------------------

  const token =
    await window.MrYebraSpotify.getToken();


  if (!token) {

    status.textContent =
      'Conecta tu cuenta de Spotify para reproducir las canciones.';

    return;

  }


  // -------------------------------------------------------
  // USUARIO CONECTADO
  // -------------------------------------------------------

  loginButton.style.display =
    'none';

  status.textContent =
    'Cargando playlist...';


  try {

    await window.MrYebraSpotify.loadPlaylist();

function renderSpotifyTracks() {

  const tracks =
    window.MrYebraSpotify.getTracks();

  trackList.innerHTML =
    '';

  // Mostrar solamente las 3 primeras canciones
  const visibleTracks =
    tracks.slice(0, 3);


  visibleTracks.forEach(
    (track, index) => {

      const row =
        document.createElement('div');

      row.className =
        'spotify-track';


      // Número de canción
      const number =
        document.createElement('div');

      number.className =
        'spotify-track-number';

      number.textContent =
        index + 1;


      // Información de la canción
      const information =
        document.createElement('div');

      information.className =
        'spotify-track-information';


      // Título
      const title =
        document.createElement('div');

      title.className =
        'spotify-track-title';

      title.textContent =
        track.name;


      // Artista
      const artist =
        document.createElement('div');

      artist.className =
        'spotify-track-artist';

      artist.textContent =
        track.artists
          .map(a => a.name)
          .join(', ');


      // Duración
      const duration =
        document.createElement('div');

      duration.className =
        'spotify-track-duration';


      const totalSeconds =
        Math.floor(
          track.duration_ms / 1000
        );

      const minutes =
        Math.floor(
          totalSeconds / 60
        );

      const seconds =
        totalSeconds % 60;


      duration.textContent =
        `${minutes}:${seconds
          .toString()
          .padStart(2, '0')}`;


      // Colocar título + artista
      information.appendChild(
        title
      );

      information.appendChild(
        artist
      );


      // Construir la fila
      row.appendChild(
        number
      );

      row.appendChild(
        information
      );

      row.appendChild(
        duration
      );


      // Pulsar en la fila reproduce la canción
      row.addEventListener(
        'click',
        () => {

          window.MrYebraSpotify.play(
            index
          );

        }
      );


      trackList.appendChild(
        row
      );

    }
  );

}


  // -------------------------------------------------------
  // INTERCAMBIAR CÓDIGO POR TOKEN
  // -------------------------------------------------------

  async function exchangeSpotifyCode(code) {

    const codeVerifier =
      localStorage.getItem(
        'mr_yebra_spotify_code_verifier'
      );


    const response =
      await fetch(
        'https://accounts.spotify.com/api/token',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/x-www-form-urlencoded'
          },

          body:
            new URLSearchParams({

              client_id:
                '25bc848823fc4b17a3b82558cb4f2b2f',

              grant_type:
                'authorization_code',

              code:
                code,

              redirect_uri:
                'https://yebrabass64.github.io/Mr.yebra-web-playlist/playlist.html',

              code_verifier:
                codeVerifier

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        'Error al obtener el token de Spotify.'
      );

    }


    const data =
      await response.json();


    localStorage.setItem(
      'mr_yebra_spotify_access_token',
      data.access_token
    );


    if (data.refresh_token) {

      localStorage.setItem(
        'mr_yebra_spotify_refresh_token',
        data.refresh_token
      );

    }


    localStorage.setItem(
      'mr_yebra_spotify_expires_at',

      (
        Date.now() +
        data.expires_in * 1000
      ).toString()

    );


    localStorage.removeItem(
      'mr_yebra_spotify_code_verifier'
    );

    localStorage.removeItem(
      'mr_yebra_spotify_state'
    );

  }

});

</script>
