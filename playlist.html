/* =====================================================
   LISTA DE CANCIONES
   ===================================================== */

.spotify-track-list {
  width: 100%;
  max-height: 186px;
  overflow-y: auto;
  overflow-x: hidden;
}
   
.spotify-track-list::-webkit-scrollbar {
  width: 8px;
}

.spotify-track-list::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.35);
  border-radius: 10px;
}

.spotify-track-list::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.12);
}


.spotify-track {

  display: grid;

  grid-template-columns:
    36px
    38px
    minmax(0, 1fr)
    auto;

  align-items: center;

  gap: 8px;

  width: 100%;

  min-height: 62px;

  padding: 10px 18px;

  box-sizing: border-box;

  cursor: pointer;

  border-bottom:
    1px solid rgba(255,255,255,0.12);

  transition:
    background-color 0.2s ease;

}


.spotify-track:hover {

  background-color:
    rgba(255,255,255,0.08);

}


/* =====================================================
   BOTÓN PLAY DE CADA CANCIÓN
   ===================================================== */

.spotify-track-play {

  width: 32px;

  height: 32px;

  border: none;

  border-radius: 50%;

  background: transparent;

  color: #fff;

  font-size: 16px;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  padding: 0;

  transition:
    background-color 0.2s ease,
    transform 0.15s ease;

}


.spotify-track-play:hover {

  background-color:
    rgba(255,255,255,0.16);

  transform: scale(1.08);

}


/* =====================================================
   NÚMERO DE CANCIÓN
   ===================================================== */

.spotify-track-number {

  text-align: center;

  font-size: 14px;

  color:
    rgba(255,255,255,0.75);

}


/* =====================================================
   INFORMACIÓN
   ===================================================== */

.spotify-track-information {

  min-width: 0;

  display: flex;

  flex-direction: column;

  justify-content: center;

}


.spotify-track-title {

  font-size: 15px;

  font-weight: 600;

  line-height: 1.3;

  color: #fff;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


.spotify-track-artist {

  margin-top: 4px;

  font-size: 12px;

  line-height: 1.3;

  color:
    rgba(255,255,255,0.65);

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


/* =====================================================
   DURACIÓN
   ===================================================== */

.spotify-track-duration {

  min-width: 48px;

  text-align: right;

  font-size: 13px;

  color:
    rgba(255,255,255,0.9);

}


/* =====================================================
   CONTROLES SUPERIORES
   ===================================================== */

.spotify-player-top {

  position: relative;

}


.spotify-player-controls {

  position: absolute;

  top: 50%;

  right: 24px;

  transform: translateY(-50%);

  display: flex;

  align-items: center;

  gap: 8px;

}


.spotify-player-controls button {

  border: none;

  background: transparent;

  color: #fff;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 6px;

  font-size: 22px;

  transition:
    transform 0.15s ease,
    opacity 0.15s ease;

}


.spotify-player-controls button:hover {

  transform: scale(1.12);

  opacity: 0.8;

}


.spotify-player-controls #play-pause-track {

  width: 46px;

  height: 46px;

  border-radius: 50%;

  background: #fff;

  color: #222;

  font-size: 20px;

}


.spotify-player-controls #play-pause-track:hover {

  opacity: 1;

  transform: scale(1.06);

}


/* =====================================================
   ESTADO / CANCIÓN ACTUAL
   ===================================================== */

.spotify-status {
    display: none;
}
   
.spotify-player-title,
.spotify-player-artist {
    display: none;
}
   
.spotify-current-track {
    display: none !important;
}
/* =====================================================
   ELIMINAR CONTROLES INFERIORES
   ===================================================== */

.spotify-current-track .player-controls {

  display: none;

}


/* =====================================================
   MÓVIL
   ===================================================== */

@media (max-width: 700px) {

  .spotify-track {

    grid-template-columns:
      32px
      30px
      minmax(0, 1fr)
      auto;

    gap: 6px;

    padding: 10px 12px;

  }


  .spotify-player-controls {

    position: static;

    transform: none;

    margin-top: 15px;

    justify-content: flex-end;

  }


  .spotify-player-top {

    display: flex;

    flex-direction: column;

  }

}

<script src="js/spotify-player.js"></script>


<script>

document.addEventListener(
  'DOMContentLoaded',
  async () => {


  const loginButton =
    document.getElementById(
      'spotify-login'
    );


  const status =
    document.getElementById(
      'spotify-status'
    );


  const trackList =
    document.getElementById(
      'spotify-track-list'
    );


  const currentTitle =
    document.getElementById(
      'current-track-title'
    );


  const currentArtist =
    document.getElementById(
      'current-track-artist'
    );


  const playPauseButton =
    document.getElementById(
      'play-pause-track'
    );


  const previousButton =
    document.getElementById(
      'previous-track'
    );


  const nextButton =
    document.getElementById(
      'next-track'
    );


  // -------------------------------------------------------
  // LOGIN
  // -------------------------------------------------------

  loginButton.addEventListener(
    'click',
    () => {

      window.MrYebraSpotify.login();

    }
  );


  // -------------------------------------------------------
  // CONTROLES DEL REPRODUCTOR
  // -------------------------------------------------------

  playPauseButton.addEventListener(
    'click',
    async () => {

      await window.MrYebraSpotify.toggle();

    }
  );


  previousButton.addEventListener(
    'click',
    async () => {

      await window.MrYebraSpotify.previous();

    }
  );


  nextButton.addEventListener(
    'click',
    async () => {

      await window.MrYebraSpotify.next();

    }
  );


  // -------------------------------------------------------
  // ACTUALIZAR INFORMACIÓN DEL REPRODUCTOR
  // -------------------------------------------------------

  window.onSpotifyTrackChanged =
    (state) => {

      if (!state || !state.track_window) {
        return;
      }


      const track =
        state.track_window.current_track;


      if (!track) {
        return;
      }


      currentTitle.textContent =
        track.name;


      currentArtist.textContent =
        track.artists
          .map(
            artist => artist.name
          )
          .join(', ');


      playPauseButton.textContent =
        state.paused
          ? '▶'
          : '❚❚';


      updateTrackButtons(
        track.uri,
        state.paused
      );

    };


  // -------------------------------------------------------
  // ACTUALIZAR BOTONES DE LAS CANCIONES
  // -------------------------------------------------------

  function updateTrackButtons(
    currentUri,
    paused
  ) {

    const buttons =
      document.querySelectorAll(
        '.spotify-track-play'
      );


    buttons.forEach(
      button => {

        const trackUri =
          button.dataset.trackUri;


        if (
          trackUri === currentUri
        ) {

          button.textContent =
            paused
              ? '▶'
              : '❚❚';

        } else {

          button.textContent =
            '▶';

        }

      }
    );

  }


  // -------------------------------------------------------
  // COMPROBAR AUTORIZACIÓN DE SPOTIFY
  // -------------------------------------------------------

  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    params.get('code');


  const state =
    params.get('state');


  const savedState =
    localStorage.getItem(
      'mr_yebra_spotify_state'
    );


  // -------------------------------------------------------
  // SI SPOTIFY DEVUELVE UN CÓDIGO
  // -------------------------------------------------------

  if (code) {


    if (
      !state ||
      !savedState ||
      state !== savedState
    ) {


      status.textContent =
        'Error de seguridad al conectar con Spotify.';


      return;

    }


    try {


      status.textContent =
        'Conectando con Spotify...';


      await exchangeSpotifyCode(
        code
      );


      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );


    } catch (error) {


      console.error(error);


      status.textContent =
        'No se ha podido conectar con Spotify.';


      return;

    }

  }


  // -------------------------------------------------------
  // COMPROBAR TOKEN
  // -------------------------------------------------------

  const token =
    await window.MrYebraSpotify.getToken();


  if (!token) {


    status.textContent =
      'Conecta tu cuenta de Spotify para reproducir las canciones.';


    return;

  }


  // -------------------------------------------------------
  // USUARIO CONECTADO
  // -------------------------------------------------------

  loginButton.style.display =
    'none';


  status.textContent =
    'Cargando playlist...';


  // -------------------------------------------------------
  // MOSTRAR CANCIONES
  // -------------------------------------------------------

  function renderSpotifyTracks() {


    const tracks =
      window.MrYebraSpotify.getTracks();


    trackList.innerHTML =
      '';


    // Mostrar todas las canciones de la playlist

    const visibleTracks =
    tracks;


    visibleTracks.forEach(
      (track, index) => {


        // ------------------------------------------------
        // Crear fila
        // ------------------------------------------------

        const row =
          document.createElement(
            'div'
          );


        row.className =
          'spotify-track';


        // ------------------------------------------------
        // BOTÓN PLAY
        // ------------------------------------------------

        const playButton =
          document.createElement(
            'button'
          );


        playButton.className =
          'spotify-track-play';


        playButton.textContent =
          '▶';


        playButton.type =
          'button';


        playButton.dataset.trackUri =
          track.uri;


        playButton.setAttribute(
          'aria-label',
          'Reproducir ' + track.name
        );


        // ------------------------------------------------
        // Número
        // ------------------------------------------------

        const number =
          document.createElement(
            'div'
          );


        number.className =
          'spotify-track-number';


        number.textContent =
          index + 1;


        // ------------------------------------------------
        // Información
        // ------------------------------------------------

        const information =
          document.createElement(
            'div'
          );


        information.className =
          'spotify-track-information';


        // ------------------------------------------------
        // Título
        // ------------------------------------------------

        const title =
          document.createElement(
            'div'
          );


        title.className =
          'spotify-track-title';


        title.textContent =
          track.name;


        // ------------------------------------------------
        // Artista
        // ------------------------------------------------

        const artist =
          document.createElement(
            'div'
          );


        artist.className =
          'spotify-track-artist';


        artist.textContent =
          track.artists
            .map(
              a => a.name
            )
            .join(', ');


        // ------------------------------------------------
        // Duración
        // ------------------------------------------------

        const duration =
          document.createElement(
            'div'
          );


        duration.className =
          'spotify-track-duration';


        const totalSeconds =
          Math.floor(
            track.duration_ms / 1000
          );


        const minutes =
          Math.floor(
            totalSeconds / 60
          );


        const seconds =
          totalSeconds % 60;


        duration.textContent =
          `${minutes}:${seconds
            .toString()
            .padStart(2, '0')}`;


        // ------------------------------------------------
        // Construir información
        // ------------------------------------------------

        information.appendChild(
          title
        );


        information.appendChild(
          artist
        );


        // ------------------------------------------------
        // Construir fila
        // ------------------------------------------------

        row.appendChild(
          playButton
        );


        row.appendChild(
          number
        );


        row.appendChild(
          information
        );


        row.appendChild(
          duration
        );


        // ------------------------------------------------
        // BOTÓN PLAY DE LA CANCIÓN
        // ------------------------------------------------

        playButton.addEventListener(
          'click',
          async (event) => {

            event.stopPropagation();


            await window.MrYebraSpotify.play(
              index
            );

          }
        );


        // ------------------------------------------------
        // PULSAR LA FILA
        // ------------------------------------------------

        row.addEventListener(
          'click',
          async () => {

            await window.MrYebraSpotify.play(
              index
            );

          }
        );


        // ------------------------------------------------
        // Añadir fila
        // ------------------------------------------------

        trackList.appendChild(
          row
        );

      }
    );

  }


  // -------------------------------------------------------
  // CARGAR PLAYLIST
  // -------------------------------------------------------

  try {


    await window.MrYebraSpotify.loadPlaylist();


    window.MrYebraSpotify.createPlayer();


    renderSpotifyTracks();


    status.textContent =
      'Selecciona una canción para reproducirla.';


  } catch (error) {


    console.error(error);


    status.textContent =
      'No se ha podido cargar la playlist.';


  }


  // -------------------------------------------------------
  // INTERCAMBIAR CÓDIGO POR TOKEN
  // -------------------------------------------------------

  async function exchangeSpotifyCode(
    code
  ) {


    const codeVerifier =
      localStorage.getItem(
        'mr_yebra_spotify_code_verifier'
      );


    const response =
      await fetch(
        'https://accounts.spotify.com/api/token',
        {

          method: 'POST',


          headers: {

            'Content-Type':
              'application/x-www-form-urlencoded'

          },


          body:
            new URLSearchParams({

              client_id:
                '25bc848823fc4b17a3b82558cb4f2b2f',


              grant_type:
                'authorization_code',


              code:
                code,


              redirect_uri:
                'https://yebrabass64.github.io/Mr.yebra-web-playlist/playlist.html',


              code_verifier:
                codeVerifier

            })

        }
      );


    if (!response.ok) {


      throw new Error(
        'Error al obtener el token de Spotify.'
      );


    }


    const data =
      await response.json();


    localStorage.setItem(
      'mr_yebra_spotify_access_token',
      data.access_token
    );


    if (data.refresh_token) {


      localStorage.setItem(
        'mr_yebra_spotify_refresh_token',
        data.refresh_token
      );


    }


    localStorage.setItem(
      'mr_yebra_spotify_expires_at',

      (
        Date.now() +
        data.expires_in * 1000
      ).toString()

    );


    localStorage.removeItem(
      'mr_yebra_spotify_code_verifier'
    );


    localStorage.removeItem(
      'mr_yebra_spotify_state'
    );


  }


});

</script>
